app:
  debug: true # app debug
  mode: "initial" # etl mode: only "initial" is accepted (APP_MODE overrides it); empty or anything else is rejected at startup

logger:
  level: "debug" # logger level

db_clean:
  host: "localhost" # database host
  port: 5432 # database port
  name: "mydatabase" # database name
  user: "postgres" # database user
  password: "your_secret_password" # database password
  schema: "public" # database schema
  max_connection_open: 10 # database max connection open
  max_connection_idle: 5 # database max connection idle
  max_life_time_ms: 3600 # database max lifetime in millisecond
  timeout_second: 10 # database timeout in second
  charset: "utf8" # database charset

db_clean_replica:
  host: "localhost" # database host
  port: 5432 # database port
  name: "mydatabase" # database name
  user: "postgres" # database user
  password: "your_secret_password" # database password
  schema: "public" # database schema
  max_connection_open: 10 # database max connection open
  max_connection_idle: 5 # database max connection idle
  max_life_time_ms: 3600 # database max lifetime in millisecond
  timeout_second: 10 # database timeout in second
  charset: "utf8" # database charset

aws:
  s3:
    region: "ap-southeast-1" # AWS region
    bucket: "traceability-bucket" # default S3 bucket
    access_key_id: "" # optional, prefer environment
    secret_access_key: "" # optional, prefer environment
    session_token: "" # optional session token
    endpoint: "" # optional custom endpoint (e.g., for localstack)
    force_path_style: false # set true for MinIO/localstack compatibility
