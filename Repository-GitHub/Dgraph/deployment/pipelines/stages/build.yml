stages:
  - stage: Build
    displayName: "Prepare Build Artifacts"
    jobs:
      - job: PrepareArtifacts
        displayName: "Create .env and Publish Context"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/gar-dev') }}:
              - group: trace-dgraph-etl-dev
          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/gar-stg') }}:
              - group: trace-dgraph-etl-stg
          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/gar-prd-1') }}:
              - group: trace-dgraph-etl-prd-1
        steps:
          - task: file-creator@6
            inputs:
              filepath: "$(Build.SourcesDirectory)/.env"
              filecontent: |
                APP_DEBUG=$(APP_DEBUG)
                APP_MODE=$(APP_MODE)
                INITIAL_WORKER_COUNT=$(INITIAL_WORKER_COUNT)
                INITIAL_CHUNK_SIZE=$(INITIAL_CHUNK_SIZE)
                LOGGER_LEVEL=$(LOGGER_LEVEL)
                DB_CLEAN_HOST=$(DB_CLEAN_HOST)
                DB_CLEAN_PORT=$(DB_CLEAN_PORT)
                DB_CLEAN_NAME=$(DB_CLEAN_NAME)
                DB_CLEAN_USER=$(DB_CLEAN_USER)
                DB_CLEAN_PASSWORD=$(DB_CLEAN_PASSWORD)
                DB_CLEAN_SCHEMA=$(DB_CLEAN_SCHEMA)
                DB_CLEAN_MAX_CONNECTION_OPEN=$(DB_CLEAN_MAX_CONNECTION_OPEN)
                DB_CLEAN_MAX_CONNECTION_IDLE=$(DB_CLEAN_MAX_CONNECTION_IDLE)
                DB_CLEAN_REPLICA_HOST=$(DB_CLEAN_REPLICA_HOST)
                DB_CLEAN_REPLICA_PORT=$(DB_CLEAN_REPLICA_PORT)
                DB_CLEAN_REPLICA_NAME=$(DB_CLEAN_REPLICA_NAME)
                DB_CLEAN_REPLICA_USER=$(DB_CLEAN_REPLICA_USER)
                DB_CLEAN_REPLICA_PASSWORD=$(DB_CLEAN_REPLICA_PASSWORD)
                DB_CLEAN_REPLICA_SCHEMA=$(DB_CLEAN_REPLICA_SCHEMA)
                DB_CLEAN_REPLICA_MAX_CONNECTION_OPEN=$(DB_CLEAN_REPLICA_MAX_CONNECTION_OPEN)
                DB_CLEAN_REPLICA_MAX_CONNECTION_IDLE=$(DB_CLEAN_REPLICA_MAX_CONNECTION_IDLE)
                DGRAPH_ALPHAS=$(DGRAPH_ALPHAS)
                DGRAPH_USERNAME=$(DGRAPH_USERNAME)
                DGRAPH_PASSWORD=$(DGRAPH_PASSWORD)
                DGRAPH_SSL_MODE=$(DGRAPH_SSL_MODE)
                DGRAPH_BEARER_TOKEN=$(DGRAPH_BEARER_TOKEN)
                DGRAPH_TIMEOUT_SECOND=$(DGRAPH_TIMEOUT_SECOND)
                DGRAPH_MAX_RETRIES=$(DGRAPH_MAX_RETRIES)
                AWS_S3_REGION=$(AWS_S3_REGION)
                AWS_S3_BUCKET=$(AWS_S3_BUCKET)
                AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
                AWS_SESSION_TOKEN=$(AWS_SESSION_TOKEN)
                AWS_S3_ENDPOINT=$(AWS_S3_ENDPOINT)
                AWS_S3_FORCE_PATH_STYLE=$(AWS_S3_FORCE_PATH_STYLE)
                INCREMENTAL_FETCH_CHUNK_SIZE=$(INCREMENTAL_FETCH_CHUNK_SIZE)
              fileoverwrite: true
              endWithNewLine: true
            displayName: "Create Env File"

          - publish: "$(Build.SourcesDirectory)"
            artifact: "DockerBuildContext"
            displayName: "Publish Docker Build Context"
