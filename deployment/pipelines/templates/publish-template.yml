parameters:
  # AWS ECR Connection Details
  - name: AwsServiceConnection
    type: string
    displayName: "AWS Service Connection Name"

  - name: AwsRegion
    type: string
    displayName: "AWS Region for ECR"

  - name: AwsAccountId
    type: string
    displayName: "AWS Account ID for ECR"

  - name: AwsEcrRepoName
    type: string
    displayName: "AWS ECR Repository Name"

  - name: ImageTag
    type: string
    displayName: "Docker Image Tag (e.g., Build ID)"

  # Docker Build Arguments
  - name: DockerFilePath
    type: string
    displayName: "Path to Dockerfile (relative to repo root)"

steps:
  - script: |
      echo "Building Docker image: ${{ parameters.AwsAccountId }}.dkr.ecr.${{ parameters.AwsRegion }}.amazonaws.com/${{ parameters.AwsEcrRepoName }}:${{ parameters.ImageTag }}"

      # Define the path to the downloaded build context
      BUILD_CONTEXT_PATH="$(Pipeline.Workspace)/DockerBuildContext"

      # Define the full path to the Dockerfile
      DOCKERFILE_FULL_PATH="${BUILD_CONTEXT_PATH}/${{ parameters.DockerFilePath }}"

      echo "Docker build context path: $BUILD_CONTEXT_PATH"
      echo "Dockerfile full path: $DOCKERFILE_FULL_PATH"

      # Check if paths exist (for debugging)
      if [ ! -d "$BUILD_CONTEXT_PATH" ]; then
        echo "Error: Build context directory not found: $BUILD_CONTEXT_PATH"
        exit 1
      fi
      if [ ! -f "$DOCKERFILE_FULL_PATH" ]; then
        echo "Error: Dockerfile not found: $DOCKERFILE_FULL_PATH"
        exit 1
      fi

      docker build \
        --no-cache \
        -t ${{ parameters.AwsAccountId }}.dkr.ecr.${{ parameters.AwsRegion }}.amazonaws.com/${{ parameters.AwsEcrRepoName }}:${{ parameters.ImageTag }} \
        -f ${DOCKERFILE_FULL_PATH} \
        ${BUILD_CONTEXT_PATH}
    displayName: "Build Docker Image"

  # AWS ECR Login and Push Docker Image
  - task: AmazonWebServices.aws-vsts-tools.AWSShellScript.AWSShellScript@1
    displayName: "Login to ECR and Push Docker Image"
    inputs:
      awsCredentials: ${{ parameters.AwsServiceConnection }}
      regionName: ${{ parameters.AwsRegion }}
      scriptType: inline
      inlineScript: |
        echo "Attempting ECR login..."
        aws ecr get-login-password --region ${{ parameters.AwsRegion }} | docker login --username AWS --password-stdin ${{ parameters.AwsAccountId }}.dkr.ecr.${{ parameters.AwsRegion }}.amazonaws.com
        echo "Login Succeeded. Pushing image..."
        docker push ${{ parameters.AwsAccountId }}.dkr.ecr.${{ parameters.AwsRegion }}.amazonaws.com/${{ parameters.AwsEcrRepoName }}:${{ parameters.ImageTag }}

  # Publish any pipeline artifacts from this stage
  - publish: "$(Pipeline.Workspace)/DockerBuildContext"
    artifact: "image-pushed-context-${{ parameters.ImageTag }}"
    displayName: "Publish Image Pushed Context"
